<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WELL Ledger · Ongoing compliance</title><link rel="stylesheet" href="/style.css"></head><body>
<aside><a class="brand" href="/">W<span class="brand-dot">●</span> <span>WELL<br><small>LEDGER</small></span></a><div class="side-label">PROJECT WORKSPACE</div><select id="project" aria-label="Project"></select><nav><button data-view="plan" class="active">◷ &nbsp; Annual plan</button><button data-view="credits">▤ &nbsp; Credit review</button><button data-view="evidence">▧ &nbsp; Evidence library</button><button data-view="research">◎ &nbsp; Why ongoing WELL?</button><button data-view="settings">⚙ &nbsp; Project settings</button></nav><button class="import-button" id="open-import">＋ Import scorecard</button><div class="side-bottom"><span class="live-dot"></span> LOCAL WORKSPACE<br><small>Your files stay beside the app.</small></div></aside>
<main><header><div id="breadcrumb">WORKSPACE / ANNUAL PLAN</div><div class="header-controls"><label>Reporting year <input id="year" type="number" min="2000" max="2100" value="2026"></label><button id="export" class="dark">↓ Export annual package</button></div></header><div id="content"></div></main>
<dialog id="import-dialog"><form id="import-form"><div class="eyebrow">NEW PROJECT</div><h2>Start with your scorecard.</h2><p>Import a WELL scorecard and the supplied 19-part Q1 2021 guide. Review applicability before confirming the plan.</p><label>Project scorecard (.xlsx)<input name="scorecard" type="file" accept=".xlsx" required></label><label>Ongoing service guide (.pdf)<input name="guide" type="file" accept=".pdf" required></label><div class="actions"><button type="button" class="close">Cancel</button><button class="dark" type="submit">Create workspace</button></div></form></dialog>
<dialog id="task-dialog"><form id="task-form"><input type="hidden" name="id"><div class="eyebrow" id="task-credit"></div><h2 id="task-title"></h2><p id="task-guidance"></p><div id="task-provenance" class="notice"></div><div class="form-grid"><label>Owner<input name="owner" placeholder="Facilities team / survey provider"></label><label>Status<select name="status"><option value="planned">Planned</option><option value="in_progress">In progress</option><option value="complete">Work complete</option><option value="submitted">Submitted to WELL Online</option></select></label><label>Window begins<input name="start" type="date" required></label><label>Due date<input name="due" type="date" required></label></div><label>Activity narrative / corrective actions<textarea name="note" rows="3" placeholder="Describe what happened, results, scope and corrective action. Avoid identifiable survey responses."></textarea></label><label>WELL Online submission reference<input name="receipt" placeholder="Receipt, document ID or dated submission note"></label><div class="actions"><button type="button" class="close">Close</button><button class="dark">Save task</button></div></form><hr><form id="evidence-form"><h3>Attach evidence</h3><div class="form-grid"><label>Evidence file<input name="file" type="file" required></label><label>Date of activity<input name="captured_on" type="date" required></label></div><button type="submit">＋ Store evidence</button></form><div id="task-files"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script src="/app.js"></script></body></html>
